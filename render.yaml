services:
  - type: web
    name: schoolie-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    # A ordem conta: o backend SIS antes da regra da SPA (o SIS não aceita CORS)
    # TODO(producao): apontar para o backend de produção quando existir; este é o de teste
    routes:
      - type: rewrite
        source: /sis/*
        destination: https://sis-backend-vp7g.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
